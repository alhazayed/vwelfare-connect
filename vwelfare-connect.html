<title>Vwelfare Connect</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: app shell. Demo bar on top; the role's screen (list + a conversation pane that fills the height, full-screen on phones); a "behind the scenes" rail with EMR calls and demo controls. */
:root{
  --bg:#EFF3F1;
  --surface:#FFFFFF;
  --sunken:#E6ECE9;
  --ink:#17231F;
  --muted:#56645E;
  --line:#D2DCD7;
  --field:#7E8C86;
  --accent:#2A6657;
  --accent-ink:#FFFFFF;
  --accent-soft:#DAEAE3;
  --good:#2E7D4F;
  --bubble:#FFFFFF;
  --new:#1F4F8A;
  --new-soft:#E1EAF6;
  --warn:#875200;
  --warn-soft:#F8EDD7;
  --danger:#9E2F2A;
  --danger-soft:#F6E1DF;
  --shadow:0 1px 2px rgba(18,38,30,.06),0 10px 30px rgba(18,38,30,.10);
  --scrim:rgba(12,22,18,.48);
  --wm:#7F8C86;
  --font-display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1513; --surface:#17201C; --sunken:#0B100E; --ink:#E1E9E5; --muted:#95A39C; --line:#28332F; --field:#6F807A;
    --accent:#6BB3A0; --accent-ink:#0C1814; --accent-soft:#1B312A; --good:#6CC28B; --bubble:#1E2925;
    --new:#8DB4E8; --new-soft:#1A2738; --warn:#E0B266; --warn-soft:#2F2617; --danger:#EC8C84; --danger-soft:#38201E;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.62); --wm:#9AA7A1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#17201C; --sunken:#0B100E; --ink:#E1E9E5; --muted:#95A39C; --line:#28332F; --field:#6F807A;
  --accent:#6BB3A0; --accent-ink:#0C1814; --accent-soft:#1B312A; --good:#6CC28B; --bubble:#1E2925;
  --new:#8DB4E8; --new-soft:#1A2738; --warn:#E0B266; --warn-soft:#2F2617; --danger:#EC8C84; --danger-soft:#38201E;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.62); --wm:#9AA7A1;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
html[lang="ar"] body{font-size:15.5px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:22px;letter-spacing:-.01em}
h2{font-size:17px}
h3{font-size:15px}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--font-mono);font-size:.92em;direction:ltr;unicode-bidi:isolate}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1380px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* demo bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.brand{display:flex;flex-direction:column;margin-inline-end:auto;min-width:0}
.brand b{font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:-.01em}
.brand span{font-size:13px;color:var(--muted)}
.tag{font-size:13px;color:var(--muted);background:var(--sunken);border:1px solid var(--line);padding:2px 10px;border-radius:99px;font-weight:500}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.lbl{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;background:var(--sunken);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;min-height:36px;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pick{border:1px solid var(--field);background:var(--surface);border-radius:10px;min-height:40px;padding:7px 10px;max-width:260px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--field);background:var(--surface);min-height:40px;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.danger:hover{filter:brightness(1.07);background:var(--danger)}
.btn.small{min-height:34px;padding:5px 12px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.btn.help svg{color:var(--danger)}
.icon-btn{border:0;background:transparent;border-radius:8px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
@media (pointer:coarse), (max-width:640px){
  .btn,.btn.small,.seg button,.pick,.tabs button{min-height:44px}
  .icon-btn{width:44px;height:44px}
}

/* shell */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;padding-block:20px 40px;align-items:start}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.screen-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.screen-head p{margin-top:2px}
.head-actions{display:flex;flex-wrap:wrap;gap:8px}
.split{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:780px){.split{grid-template-columns:minmax(0,1fr)}}

/* lists */
.list{padding:6px}
.list-h{font-size:13px;color:var(--muted);font-family:var(--font-body);font-weight:500;padding:8px 10px 4px}
.list ul{display:flex;flex-direction:column;gap:2px}
.pt{width:100%;text-align:start;border:0;background:transparent;border-radius:9px;padding:10px 12px;min-height:56px;cursor:pointer;display:flex;flex-direction:column;gap:3px;color:var(--ink)}
.pt:hover{background:var(--sunken)}
.pt.on{background:var(--sunken);box-shadow:inset 0 0 0 1px var(--field)}
.pt-name{font-weight:600}
.pt-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;line-height:1.5;padding:1px 9px;border-radius:99px;background:var(--sunken);color:var(--muted);font-weight:500;white-space:nowrap}
.pill.ok::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.pill.new{background:var(--new-soft);color:var(--new)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.list .empty{padding:18px 10px}

/* pane: fills the height so the message box is always visible */
.pane{display:flex;flex-direction:column;min-width:0;overflow:hidden;height:clamp(520px, calc(100vh - 170px), 820px)}
.pane-head{padding:12px 16px 0;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);flex:none}
.pane-top{display:flex;align-items:center;gap:8px}
.who{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;min-width:0;flex:1}
.back{display:none}
[dir="rtl"] .back svg{transform:scaleX(-1)}
.visits{display:flex;align-items:center;gap:6px 10px;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.chips li{font-size:13px;background:var(--sunken);border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabs{display:flex;gap:4px;margin-bottom:-1px}
.tabs button{border:0;background:transparent;min-height:40px;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.pane-body{flex:1;min-height:0;display:flex;flex-direction:column}
.pane-body > .empty{flex:1}
.sess-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 16px;border-bottom:1px solid var(--line);flex:none}
.sess-bar p{min-width:0;flex:1 1 240px}
.note{margin:10px 16px 0;padding:10px 12px;border-radius:9px;background:var(--sunken);font-size:14px;flex:none;display:flex;gap:8px;align-items:flex-start}
.note svg{width:18px;height:18px;flex:none;margin-top:2px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--accent-soft);color:var(--ink)}
.note.danger{background:var(--danger-soft);color:var(--ink)}
.note.danger svg{color:var(--danger)}

/* thread */
.thread{background:var(--sunken);padding:16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;min-height:0}
.msg{display:flex;flex-direction:column;align-items:flex-start;max-width:min(80%,560px);gap:3px}
.msg.mine{align-self:flex-end;align-items:flex-end}
.bubble{background:var(--bubble);border:1px solid var(--line);border-radius:14px;border-start-start-radius:4px;padding:8px 12px;overflow-wrap:anywhere}
.msg.mine .bubble{background:var(--accent-soft);border-color:var(--accent-soft);border-start-start-radius:14px;border-start-end-radius:4px}
.msg.risk .bubble{border:2px solid var(--danger)}
.meta{font-size:13px;color:var(--muted);padding-inline:4px}
.sys{align-self:center;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 12px;text-align:center}
.sys.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent;border-radius:10px;max-width:520px}
.file{display:flex;flex-direction:column;gap:6px}
.file img{max-width:220px;border-radius:8px;display:block;-webkit-user-drag:none}
.file-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.file-row svg{width:18px;height:18px;flex:none}
.fname{font-weight:500;direction:ltr;unicode-bidi:isolate}

/* composer */
.composer-wrap{border-top:1px solid var(--line);padding:8px 12px 12px;flex:none;background:var(--surface)}
.composer-note{font-size:13px;color:var(--muted);margin-bottom:6px}
.composer{display:flex;align-items:flex-end;gap:8px}
.composer textarea{flex:1;min-width:0;resize:none;min-height:44px;max-height:140px;border:1px solid var(--field);background:var(--surface);border-radius:10px;padding:10px 12px}
.attach{position:relative;width:44px;height:44px;flex:none;display:grid;place-items:center;border:1px solid var(--field);border-radius:10px;cursor:pointer;color:var(--ink)}
.attach:hover{background:var(--sunken)}
.attach:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.attach svg{width:18px;height:18px}
.attach input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.composer .send{min-height:44px}

/* urgent help */
.urgent{margin:10px 16px 0;padding:12px 14px;border-radius:10px;background:var(--danger-soft);border:1px solid var(--danger);display:flex;flex-direction:column;gap:6px;flex:none}
.urgent b{font-family:var(--font-display);font-weight:600}
.help-list{display:flex;flex-direction:column;gap:8px}
.help-list li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.help-list li > div{display:flex;flex-direction:column;min-width:0}
.help-num{font-size:20px;font-weight:500;-webkit-user-select:all;user-select:all}
.call{min-height:44px;padding-inline:18px}
.call svg{color:inherit}

/* past */
.past{padding:16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;min-height:0}
.past h3:not(:first-child){margin-top:12px}
.recs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.recs li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;flex-wrap:wrap}
.recs li + li{border-top:1px solid var(--line)}
.rec-main{display:flex;flex-direction:column;min-width:0}
.rec-when{font-weight:600}
.locked{color:var(--muted);display:inline-flex}
.locked svg{width:18px;height:18px}
.consent-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.consent-row .note{margin:0}

/* patient */
.req{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin-bottom:14px;border-color:var(--new);background:var(--new-soft)}
.req > div:first-child{flex:1 1 320px;display:flex;flex-direction:column;gap:4px}
.grants{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.grant{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;font-size:14px;padding:10px 14px;border-radius:10px;background:var(--sunken)}
.auth{display:grid;place-items:center;padding-block:24px}
.auth-card{width:min(440px,100%);display:flex;flex-direction:column;gap:14px;padding:24px}
.eyebrow{font-size:13px;color:var(--accent);font-weight:600}

/* forms */
.stack{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:14px}
.fld > span{font-weight:500}
.fld input{border:1px solid var(--field);background:var(--surface);border-radius:9px;min-height:44px;padding:9px 11px;width:100%}
.unit{display:flex;align-items:center;gap:8px}
.unit input{width:96px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px;flex:none;width:20px;height:20px;accent-color:var(--accent)}
.err{color:var(--danger);font-size:14px}
.err:empty{display:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.row-form{display:flex;align-items:flex-end;gap:8px}
.grow{flex:1;min-width:0}
.emr-box{border:1px dashed var(--accent);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.emr-tag{font-size:13px;font-weight:600;color:var(--accent)}
.kv{display:flex;flex-direction:column;gap:8px;margin:0}
.kv > div{display:flex;flex-direction:column;gap:1px}
.kv dt{font-size:13px;color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
fieldset.fs{border:1px solid var(--line);border-radius:10px;padding:10px 14px 14px;margin:0;display:flex;flex-direction:column;gap:10px}
fieldset.fs legend{font-weight:600;font-size:14px;padding-inline:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* admin */
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:start;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums}
.admin-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;margin-top:16px;align-items:start}
@media (max-width:900px){.admin-grid{grid-template-columns:minmax(0,1fr)}}
.admin-grid h2{margin-bottom:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.filters input{flex:1 1 200px;min-width:0;border:1px solid var(--field);background:var(--surface);border-radius:9px;min-height:40px;padding:8px 11px}
.audit{display:flex;flex-direction:column;margin-top:10px;max-height:460px;overflow-y:auto}
.audit li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.audit time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.audit b{font-weight:600;display:block}
@media (max-width:520px){.audit li{grid-template-columns:minmax(0,1fr)}}
.add-prov{margin-bottom:16px;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.grid3,.grid2{grid-template-columns:minmax(0,1fr)}}

/* rail */
.rail{display:flex;flex-direction:column;gap:12px}
.rail-head{padding:2px 2px 0;display:flex;flex-direction:column;gap:2px}
.rail-head h2{font-size:15px;display:flex;align-items:center;gap:8px}
.rail-head h2::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--muted);flex:none}
.rail .card{border-style:dashed}
.rail h3{margin-bottom:10px}
.okt{color:var(--good);font-weight:600}
.warnt{color:var(--warn);font-weight:500}
.conn{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.conn + .conn{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;background:var(--good)}
.dot.off{background:var(--danger)}
.dot.warn{background:var(--warn)}
.queue{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.api{display:flex;flex-direction:column;max-height:420px;overflow-y:auto}
.api li{padding:8px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.api li:first-child{border-top:0;padding-top:0}
.api-line{display:flex;align-items:baseline;gap:8px;direction:ltr;font-family:var(--font-mono);font-size:13px;min-width:0}
.api-line code{overflow-wrap:anywhere;min-width:0;flex:1}
.m{font-weight:600;font-size:12px;padding:0 5px;border-radius:4px;background:var(--new-soft);color:var(--new)}
.m.POST{background:var(--accent-soft);color:var(--ink)}
.st{color:var(--good)}
.st.bad{color:var(--danger)}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid;place-items:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.dialog{background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:var(--shadow);width:min(540px,100%);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column}
.dialog.wide{width:min(760px,100%)}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 18px 10px}
.dlg-head > div{display:flex;flex-direction:column;gap:4px;min-width:0}
.dlg-body{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:10px}
.step svg{width:18px;height:18px;flex:none}
.step.done svg{color:var(--good)}
.step.fail svg{color:var(--danger)}
.step.wait{color:var(--muted)}
.dot-wait{width:18px;height:18px;border:2px dashed var(--field);border-radius:50%;flex:none}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none;border-top-color:var(--accent)}}
.lock-note{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.lock-note svg{width:16px;height:16px;flex:none}
.viewer-body{position:relative;border-radius:10px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.viewer-body .thread{max-height:min(58vh,560px);flex:none}
.wm{position:absolute;inset:0;pointer-events:none;background-repeat:repeat}
.away-msg{display:none;position:absolute;inset:0;place-items:center;text-align:center;padding:20px;font-weight:500}
body.away .viewer-body .thread{filter:blur(12px)}
body.away .away-msg{display:grid}

/* toast */
.toast-host{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:60;padding-inline:16px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:14px;max-width:520px}
.toast.bad{background:var(--danger);color:var(--surface)}

/* phones: list first, then a full-screen conversation */
@media (max-width:780px){
  .split[data-view="list"] .pane{display:none}
  .split[data-view="pane"] .list{display:none}
  .split[data-view="pane"] .pane{position:fixed;inset:0;z-index:40;height:auto;border:0;border-radius:0;
    padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .split[data-view="pane"] .composer-wrap{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  body:has(.split[data-view="pane"]){overflow:hidden}
  .back{display:grid}
  .pane-head{padding-top:8px}
  .help-short{display:none}
}
@media (min-width:781px){.help-icon-only{display:none}}
@media (max-width:640px){.brand span{display:none}.lbl{display:none}}
@media print{body{display:none!important}}

function loadPast(role, f, pid, key){
  S.past = { key, loading:true };
  const all = EMR.records[f] || [];
  const items = role === "patient" ? all.filter(r => r.providerId === pid) : all.slice();
  const q = role === "patient" ? `?provider=${pid}` : "";
  emr("GET", `/patients/${f}/chat-records${q}`, { k:"retRecords", v:{ n:items.length } })
    .then(() => { if (S.past && S.past.key === key){ S.past = { key, items: items.sort((a,b) => b.start - a.start) }; renderMain(); } })
    .catch(() => { if (S.past && S.past.key === key){ S.past = { key, error:true }; renderMain(); } });
}

  </li>`).join("")}</ul>`;
}

  const st = S.past;
  if (st.loading) return `<div class="empty"><span class="spin"></span>${t("loading")}</div>`;
  if (st.error) return `<div class="empty"><p>${t("emrDown")}</p><button type="button" class="btn" data-act="reloadPast">${t("retryLoad")}</button></div>`;
  if (role === "patient") return `<div class="past"><h3>${t("pastWith", { name:L(prov(pid).name) })}</h3>${recList(st.items, true, false)}</div>`;
  const nm = ptName(f);
  const mine = st.items.filter(r => r.providerId === pid);
  const others = st.items.filter(r => r.providerId !== pid);
  let out = `<div class="past"><h3>${t("pastMine", { name:nm })}</h3>${recList(mine, true, false)}`;
  if (others.length){
    const c = P.patients[f].consents[pid];
    const state =
      c === "granted" ? `<p class="note ok">${t("consentGranted")}</p>` :
      c === "pending" ? `<p class="note">${t("consentPending")}</p>` :
      c === "denied"  ? `<p class="note warn">${t("consentDenied")}</p><button type="button" class="btn small" data-act="askConsent">${t("askAgain")}</button>` :
      `<p class="muted">${t("othersLocked", { name:nm })}</p><button type="button" class="btn small" data-act="askConsent">${ICON.lock}${t("askConsent")}</button>`;
    out += `<h3>${t("pastOthers")}</h3><div class="consent-row">${state}</div>${recList(others, c === "granted", true)}`;
  }
  return out + `</div>`;
}

function auditEntries(){
  return AUDIT.slice().sort((a,b) => b.at - a.at).map(a => {
    const v = Object.assign({}, a.args);
    if (v.pid) v.name = L(prov(v.pid).name);
    if (v.rec) v.rec = monoRaw(v.rec);
    if (v.file) v.file = monoRaw(v.file);
    let who, type;
    if (a.who === "admin"){ who = t("who_admin"); type = "admin"; }
    else if (a.who === "system"){ who = t("who_system"); type = "system"; }
    else if (a.who.indexOf("patient:") === 0){ who = t("who_patient", { file: a.who.slice(8) }); type = "patient"; }
    else { who = esc(L(prov(a.who).name)); type = "provider"; }
    const html = `<li><time>${fDT(a.at)}</time><div><b>${who}</b>${t("a_" + a.act, v)}</div></li>`;
    return { html, type, text: html.replace(/<[^>]+>/g, " ").toLowerCase() };
  });
}

/* ---------- provider ---------- */
function providerHTML(){
  if (!prov(S.me) || !prov(S.me).active){
    const first = P.providers.find(p => p.active);
    if (!first) return `<div class="empty">${t("noPatients")}</div>`;
    S.me = first.id; S.sel = null;
  }
  const me = prov(S.me);
  const mine = Object.keys(P.patients).filter(f => P.patients[f].providers.includes(S.me));
  if (!mine.includes(S.sel)) S.sel = mine[0] || null;
  const items = mine.map(f => {
    const pt = P.patients[f], s = openSess(f, S.me), lk = lockedSess(f, S.me);
    let pill = "";
    if (pt.status === "invited") pill = `<span class="pill warn">${t("awaiting")}</span>`;
    else if (lk) pill = `<span class="pill warn">${t("waitSync")}</span>`;
    if (s){
      if (s.risk) pill += `<span class="pill danger">${t("riskPill")}</span>`;
      const last = s.msgs[s.msgs.length-1];
      pill += last.from === "patient" ? `<span class="pill new">${t("newMsg")}</span>` : `<span class="pill ok">${t("chatOpen")}</span>`;

/* ---------- patient ---------- */
function patientHTML(){
  const f = S.patient, pt = P.patients[f];
  if (!pt) return "";
  if (pt.status === "invited") return inviteHTML(f, pt);
  if (!S.signedIn[f]) return loginHTML(f, pt);
  const teamIds = activeTeam(pt);
  if (!teamIds.includes(S.ptSel)) S.ptSel = teamIds[0] || null;
  const nm = ptName(f);
  const reqs = teamIds.filter(pid => pt.consents[pid] === "pending").map(pid =>
    `<div class="card req"><div><h3>${t("reqTitle")}</h3><p>${t("reqBody", { provider:L(prov(pid).name) })}</p></div>
      <div class="actions"><button type="button" class="btn" data-act="consent" data-pid="${pid}" data-ans="denied">${t("decline")}</button>
      <button type="button" class="btn primary" data-act="consent" data-pid="${pid}" data-ans="granted">${t("allow")}</button></div></div>`).join("");
  const grants = teamIds.filter(pid => pt.consents[pid] === "granted").map(pid =>
    `<div class="grant"><span>${t("granted", { provider:L(prov(pid).name) })}</span><button type="button" class="btn small" data-act="revoke" data-pid="${pid}">${t("withdraw")}</button></div>`).join("");
  const team = teamIds.map(pid => {
    const p = prov(pid), s = openSess(f, pid);
    const pill = s ? (s.msgs[s.msgs.length-1].from === "provider" ? `<span class="pill new">${t("newMsg")}</span>` : `<span class="pill ok">${t("chatOpen")}</span>`) : "";
    return `<li><button type="button" class="pt${pid===S.ptSel ? " on" : ""}" data-act="ptSel" data-v="${pid}" aria-current="${pid===S.ptSel}">
      <span class="pt-name">${esc(L(p.name))}</span><span class="pt-meta"><span>${esc(L(p.spec))}</span>${pill}</span></button></li>`;
  }).join("");
  let pane;
  if (!S.ptSel) pane = `<div class="empty">${t("noTeam")}</div>`;
  else {
    const p = prov(S.ptSel);
    pane = `<header class="pane-head"><div class="pane-top">${backBtn()}<div class="who"><h2>${esc(L(p.name))}</h2><span class="muted">${esc(L(p.spec))}</span></div>${helpBtn(true)}</div>${tabs("pttab", S.ptTab)}</header>`
      + `<div class="pane-body">${S.ptTab === "current" ? patientCurrent(f, S.ptSel) : pastHTML("patient", f, S.ptSel)}</div>`;
  }
  return `<div class="screen-head"><div><h1>${t("hello", { name:nm.split(" ")[0] })}</h1><p class="muted">${esc(pt.username)} · ${t("fileLabel", { n:monoRaw(f) })}</p></div>
      <div class="head-actions">${helpBtn(false)}<button type="button" class="btn" data-act="signOut">${t("signOut")}</button></div></div>
    ${reqs}${grants ? `<div class="grants">${grants}</div>` : ""}
    <div class="split" data-view="${S.ptView}">
      <aside class="card list"><h2 class="list-h">${t("careTeam")}</h2><ul>${team || `<li class="empty">${t("noTeam")}</li>`}</ul></aside>
      <section class="card pane">${pane}</section>
    </div>`;
}

  const s = P.sessions.find(x => x.id === m.sid);
  if (!s) return "";
  const body = `<p>${t("finishBody", { file:monoRaw(s.file), rec:monoRaw(recName(s.file, s.start)) })}</p>
    <div class="actions"><button type="button" class="btn" data-act="closeModal">${t("keepChatting")}</button>
    <button type="button" class="btn primary" data-act="finishGo">${ICON.lock}${t("finishGo")}</button></div>`;
  return dialog(t("finishQ"), "", body);
}
function progressModalHTML(m){
  const keys = { lock:"stepLock", build:"stepBuild", send:"stepSend", del: m.queued ? "stepDelWait" : "stepDel" };
  const icon = { done:ICON.check, run:`<span class="spin"></span>`, fail:ICON.alert, wait:`<span class="dot-wait"></span>` };
  const busy = m.steps.some(s => s.st === "run");
  const body = `<ol class="steps">${m.steps.map(s => `<li class="step ${s.st}">${icon[s.st]}<span>${t(keys[s.k], s.v)}</span></li>`).join("")}</ol>
    ${m.queued ? `<p class="note warn">${t("stepFail")}</p>` : ""}
    ${busy ? "" : `<div class="actions"><button type="button" class="btn primary" data-act="closeModal">${t("done")}</button></div>`}`;
  return dialog(t("finishChat"), `<span class="mono">${esc(m.rec)}</span>`, body);
}
function deactModalHTML(m){
  const p = prov(m.pid);
  const n = P.sessions.filter(s => s.providerId === p.id && !s.locked).length;
  const pc = Object.values(P.patients).filter(x => x.providers.includes(p.id)).length;
  const body = `<p>${t("deactBody", { name:L(p.name), n, p:pc })}</p>
    <div class="actions"><button type="button" class="btn" data-act="closeModal">${t("cancel")}</button>
    <button type="button" class="btn danger" data-act="deactGo">${t("deactGo")}</button></div>`;
  return dialog(t("deactQ", { name:L(p.name) }), "", body);
}
function helpModalHTML(){
  return dialog(t("helpTitle"), "", `<p>${t("helpBody")}</p>${helpNumbersHTML()}<p class="muted small">${t("callHint")}</p>`);
}
function findRec(uid){
  for (const f in EMR.records){ const r = EMR.records[f].find(x => x.uid === uid); if (r) return r; }
  return null;
}
function wmURI(text){
  const col = getComputedStyle(document.documentElement).getPropertyValue("--wm").trim() || "#7F8C86";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="340" height="170"><text x="170" y="90" text-anchor="middle" transform="rotate(-22 170 85)" fill="${col}" fill-opacity="0.28" font-family="sans-serif" font-size="13">${esc(text)}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
function viewerModalHTML(m){
  const r = findRec(m.uid);
  if (!r) return "";
  const viewer = S.role === "patient" ? "patient" : "provider";
  const viewerName = viewer === "patient" ? ptName(r.file) + " · " + r.file : L(prov(S.me).name);
  const sub = `${esc(L(prov(r.providerId).name))} · ${esc(ptName(r.file))} · <span class="mono">${esc(r.id)}</span>`;
  const body = `<p class="lock-note">${ICON.lock}${t("readOnly")}</p>
    <div class="viewer-body" data-protected>${threadHTML(r, viewer)}
      <div class="wm" style="background-image:url('${wmURI(viewerName + " · " + fDT(m.openedAt))}')"></div>
      <div class="away-msg">${t("hiddenAway")}</div></div>`;
  return dialog(`${fDT(r.start)} – ${fTime(r.end)}`, sub, body, "wide");
}
function renderModal(){
  const m = S.modal, host = $("#modal");
  if (!m){ host.innerHTML = ""; return; }
  const html = m.type === "add" ? addModalHTML(m) : m.type === "finish" ? finishModalHTML(m) : m.type === "progress" ? progressModalHTML(m)
    : m.type === "deact" ? deactModalHTML(m) : m.type === "help" ? helpModalHTML() : viewerModalHTML(m);
  host.innerHTML = `<div class="scrim" data-act="scrim">${html}</div>`;
  const th = host.querySelector(".thread"); if (th) th.scrollTop = 0;
  if (m.needFocus){
    m.needFocus = false;
    const el = host.querySelector("input,[data-act='finishGo'],[data-act='deactGo'],.call,.icon-btn");
    if (el) el.focus();
  }
}
function renderToast(){
  $("#toast").innerHTML = S.toast ? `<div class="toast ${S.toast.kind || ""}" role="status">${S.toast.html}</div>` : "";
}

/* ---------- render ---------- */
function renderMain(){
  $("#main").innerHTML = S.role === "admin" ? adminHTML() : S.role === "provider" ? providerHTML() : patientHTML();
  document.querySelectorAll("#main .thread").forEach(el => { el.scrollTop = el.scrollHeight; });
  if (S.focus){ const el = document.getElementById("draft-" + S.focus); if (el) el.focus({ preventScroll:true }); S.focus = null; }
}
function render(){
  const root = document.documentElement;
  root.lang = S.lang; root.dir = S.lang === "ar" ? "rtl" : "ltr";
  $("#rail").setAttribute("aria-label", I18N[S.lang].behind);
  $("#bar").innerHTML = barHTML();
  renderMain(); renderRail(); renderModal(); renderToast();
}

/* ---------- actions ---------- */
function newSession(f, pid, by){
  const s = { id:"s"+(++SID), file:f, providerId:pid, start:new Date(), locked:false, msgs:[{ from:"system", by, at:new Date() }] };
  P.sessions.push(s);
  if (by === "patient") audit("patient:" + f, "patientStart", { pid });
  else audit(pid, "startChat", { file:f });
  return s;
}
function keyParts(key){ const [, f, pid] = key.split(":"); return { f, pid }; }
function patientSession(f, pid){
  let s = openSess(f, pid);
  if (!s) s = newSession(f, pid, "patient");
  return s;
}
function afterPatientMessage(s){
  if (S.afterHours && !s.autoReplied){
    s.autoReplied = true;
    s.msgs.push({ from:"system", kind:"afterhours", at:new Date() });
  }
}
function sendMsg(key, role){
  const text = (S.drafts[key] || "").trim();
  if (!text) return;
  const { f, pid } = keyParts(key);
  let s = role === "patient" ? patientSession(f, pid) : openSess(f, pid);
  if (!s) return;
  const m = { from:role, at:new Date(), text };
  if (role === "patient" && RISK.test(text)){
    m.risk = true;
    if (!s.risk){ s.risk = true; audit("system", "risk", { file:f, pid }); }
  }
  s.msgs.push(m);
  if (role === "patient") afterPatientMessage(s);
  S.drafts[key] = ""; S.focus = key;
  renderMain(); renderRail();
}
function attachFile(key, role, file){
  if (!/\.(pdf|jpe?g|png|docx|m4a)$/i.test(file.name) || file.size > 10*1048576){ toast(t("badFile"), "bad"); return; }
  const { f, pid } = keyParts(key);
  let s = role === "patient" ? patientSession(f, pid) : openSess(f, pid);
  if (!s) return;
  s.msgs.push({ from:role, at:new Date(), file:{ name:file.name, size:file.size, url: /^image\//.test(file.type) ? URL.createObjectURL(file) : null } });
  if (role === "patient") afterPatientMessage(s);
  renderMain(); renderRail();
}
function commit(s, rec){
  (EMR.records[s.file] = EMR.records[s.file] || []).push({ uid:"r"+(++UID), id:rec, file:s.file, providerId:s.providerId, start:s.start, end:s.end, msgs:s.msgs });
  P.sessions = P.sessions.filter(x => x !== s);
}
async function syncSession(s, who){
  s.locked = true; s.end = s.end || new Date();
  const rec = recName(s.file, s.start);
  try {
    await emr("POST", `/patients/${s.file}/chat-records`, { k:"retSaved", v:{ rec } }, 201);
    commit(s, rec);
    audit(who, "finish", { rec });
    return true;
  } catch (e) {
    if (!S.queue.includes(s.id)) S.queue.push(s.id);
    audit(who, "queued", { rec });
    return false;
  }
}
async function doFinish(sid){
  const s = P.sessions.find(x => x.id === sid);
  if (!s) return;
  s.locked = true; s.end = new Date();
  S.modal = { type:"progress", rec:recName(s.file, s.start), steps:[
    { k:"lock", st:"done" }, { k:"build", st:"done", v:{ m:countMsgs(s.msgs), f:countFiles(s.msgs) } },
    { k:"send", st:"run" }, { k:"del", st:"wait" } ] };
  render();
  const ok = await syncSession(s, s.providerId);
  if (ok){ S.modal.steps[2].st = "done"; S.modal.steps[3].st = "done"; }
  else { S.modal.steps[2].st = "fail"; S.modal.queued = true; }
  if (S.modal && S.modal.type === "progress") render(); else { renderMain(); renderRail(); }
}
async function retryQueue(){
  for (const sid of S.queue.slice()){
    const s = P.sessions.find(x => x.id === sid);
    if (!s){ S.queue = S.queue.filter(x => x !== sid); continue; }
    const rec = recName(s.file, s.start);
    try {
      await emr("POST", `/patients/${s.file}/chat-records`, { k:"retSaved", v:{ rec } }, 201);
      commit(s, rec);
      S.queue = S.queue.filter(x => x !== sid);
      audit("system", "retry", { rec });
    } catch (e) { break; }
  }
  S.past = null;
  renderMain(); renderRail();
}
async function deactivate(pid){
  const p = prov(pid);
  const open = P.sessions.filter(s => s.providerId === pid && !s.locked);
  p.active = false;
  audit("admin", "deactivate", { pid });
  S.modal = null; render();
  for (const s of open){ await syncSession(s, "system"); }
  renderMain(); renderRail();
  toast(t("deactDone", { name:L(p.name), n:open.length }));
}
async function doLookup(){
  const m = S.modal;
  const f = (m.file || "").trim();
  m.err = null; m.found = null; m.mErr = false;
  if (!/^\d{3,12}$/.test(f)){ m.err = { k:"notFound", v:{ n:f || "—" } }; renderModal(); return; }
  m.busy = true; renderModal();
  const exists = !!EMR.patients[f];
  try {
    await emr("GET", `/patients/${f}?fields=name`, { k: exists ? "retNameVisits" : "retNotFound" }, exists ? 200 : 404);
    if (exists) await emr("GET", `/patients/${f}/visits?fields=date`, { k:"retVisits" });
    if (S.modal !== m) return;
    if (exists) m.found = f; else m.err = { k:"notFound", v:{ n:f } };
  } catch (e) {
    if (S.modal !== m) return;
    m.err = { k:"emrDown" };
  }
  m.busy = false;
  renderModal();
  const mob = document.getElementById("add-mobile"); if (mob) mob.focus();
}
function openRecord(uid){
  const r = findRec(uid);
  if (!r) return;
  emr("GET", `/chat-records/${r.id}`, { k:"retRecord" }).then(() => {
    S.modal = { type:"viewer", uid, openedAt:new Date(), needFocus:true };
    audit(S.role === "patient" ? "patient:" + S.patient : S.me, "view", { rec:r.id });
    renderModal();
  }).catch(() => toast(t("emrDown"), "bad"));
}
function selectPatient(f){
  S.sel = f; S.tab = "current"; S.past = null; S.pvView = "pane";
  renderMain();
  emr("GET", `/patients/${f}?fields=name`, { k:"retNameVisits" }).then(() => emr("GET", `/patients/${f}/visits?fields=date`, { k:"retVisits" })).catch(() => {});
}

const ACT = {
  role: d => { S.role = d.v; S.past = null; S.modal = null; S.pvView = "list"; S.ptView = "list"; render(); },
  lang: () => { S.lang = S.lang === "en" ? "ar" : "en"; render(); },
  selPatient: d => selectPatient(d.v),
  back: () => { if (S.role === "patient") S.ptView = "list"; else S.pvView = "list"; renderMain(); },
  ptab: d => { S.tab = d.v; S.past = null; renderMain(); },
  pttab: d => { S.ptTab = d.v; S.past = null; renderMain(); },
  ptSel: d => { S.ptSel = d.v; S.ptTab = "current"; S.past = null; S.ptView = "pane"; renderMain(); },
  reloadPast: () => { S.past = null; renderMain(); },
  help: () => { S.modal = { type:"help", needFocus:true }; renderModal(); },
  openAdd: () => { S.modal = { type:"add", file:"", mobile:"", needFocus:true }; renderModal(); },
  closeModal: () => { if (S.modal && S.modal.type === "progress" && S.modal.steps.some(s => s.st === "run")) return; S.modal = null; renderModal(); renderMain(); },
  scrim: (d, e, el) => { if (e.target === el) ACT.closeModal(); },
  openFound: () => { const f = S.modal.found; S.modal = null; renderModal(); selectPatient(f); },
  linkPatient: () => {
    const f = S.modal.found;
    P.patients[f].providers.push(S.me);
    audit(S.me, "linkPatient", { file:f });
    S.modal = null; renderModal(); selectPatient(f); renderRail();
    toast(t("patientLinked", { name:ptName(f) }));
  },
  startChat: () => { newSession(S.sel, S.me, "provider"); S.focus = `pv:${S.sel}:${S.me}`; renderMain(); renderRail(); },
  finish: d => { S.modal = { type:"finish", sid:d.v, needFocus:true }; renderModal(); },
  finishGo: () => doFinish(S.modal.sid),
  viewRec: d => openRecord(d.v),
  askConsent: () => { P.patients[S.sel].consents[S.me] = "pending"; audit(S.me, "ask", { file:S.sel }); renderMain(); },
  consent: d => { const f = S.patient; P.patients[f].consents[d.pid] = d.ans; audit("patient:" + f, d.ans === "granted" ? "grant" : "deny", { pid:d.pid }); renderMain(); },
  revoke: d => { const f = S.patient; delete P.patients[f].consents[d.pid]; audit("patient:" + f, "revoke", { pid:d.pid }); renderMain(); },
  signOut: () => { S.signedIn[S.patient] = false; S.ptView = "list"; renderMain(); },
  toggleEmr: () => {
    S.emrOnline = !S.emrOnline; renderRail();
    if (S.emrOnline && S.queue.length) setTimeout(retryQueue, 700);
  },
  toggleHours: () => { S.afterHours = !S.afterHours; renderRail(); renderMain(); },
  retry: () => retryQueue(),
  toggleAddProv: () => { S.addProv = !S.addProv; renderMain(); if (S.addProv){ const el = document.getElementById("np-name"); if (el) el.focus(); } },
  toggleProv: d => {
    const p = prov(d.v);
    if (p.active){ S.modal = { type:"deact", pid:p.id, needFocus:true }; renderModal(); return; }
    p.active = true; audit("admin", "reactivate", { pid:p.id }); render();
  },
  deactGo: () => deactivate(S.modal.pid)
};

const SUBMIT = {
  send: form => sendMsg(form.dataset.key, form.dataset.role),
  lookup: () => doLookup(),
  createPatient: () => {
    const m = S.modal, f = m.found;
    const digits = (m.mobile || "").replace(/\D/g, "");
    if (digits.length < 8){ m.mErr = true; renderModal(); const el = document.getElementById("add-mobile"); if (el) el.focus(); return; }
    P.patients[f] = { providers:[S.me], status:"invited", invitedBy:S.me, mobile:"•••• " + digits.slice(-4), consents:{} };
    audit(S.me, "createPatient", { file:f });
    S.modal = null; renderModal(); selectPatient(f); renderRail();
    toast(t("patientInvited", { name:ptName(f) }));
  },
  addProv: () => {
    const name = $("#np-name").value.trim(), spec = $("#np-spec").value.trim(), email = $("#np-email").value.trim();
    if (!name || !spec || !/^\S+@\S+\.\S+$/.test(email)){ $("#np-err").innerHTML = t("fillProvider"); return; }
    const id = "p" + (P.providers.length + 1);
    P.providers.push({ id, name, spec, email, active:true });
    audit("admin", "createProvider", { pid:id });
    S.addProv = false; renderMain(); renderRail();
    toast(t("provInvited", { email }));
  },
  rules: () => {
    const r = Number($("#rl-remind").value), a = Number($("#rl-auto").value);
    if (!Number.isInteger(r) || !Number.isInteger(a) || r < 1 || a > 168 || r >= a){ $("#rl-err").innerHTML = t("rulesErr"); return; }
    RULES.remindH = r; RULES.autoH = a;
    RULES.emergency = cleanNum($("#rl-em").value); RULES.crisisLine = cleanNum($("#rl-crisis").value);
    audit("admin", "rules");
    renderMain();
    toast(t("rulesSaved"));
  },
  signIn: () => { S.signedIn[S.patient] = true; audit("patient:" + S.patient, "signIn"); renderMain(); },
  invite: () => {
    const u = $("#inv-user").value.trim(), p1 = $("#inv-pw").value, p2 = $("#inv-pw2").value, ok = $("#inv-consent").checked;
    const err = $("#inv-err");
    if (u.length < 4){ err.innerHTML = t("errUser"); return; }
    if (p1.length < 8 || p1 !== p2){ err.innerHTML = t("errPw"); return; }
    if (!ok){ err.innerHTML = t("errConsent"); return; }
    const pt = P.patients[S.patient];
    pt.status = "active"; pt.username = u;
    S.signedIn[S.patient] = true;
    audit("patient:" + S.patient, "accountCreated");
    render();
    toast(t("accountCreated"));
  }
};

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset, e, el);
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const fn = SUBMIT[e.target.dataset.submit];
  if (fn) fn(e.target);
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.draft) S.drafts[el.dataset.draft] = el.value;
  if (el.dataset.m && S.modal) S.modal[el.dataset.m] = el.value;
  if (el.dataset.audit === "q"){ S.auditQ = el.value; const list = $("#audit-list"); if (list) list.innerHTML = auditListHTML(); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.pick === "provider"){ S.me = el.value; S.sel = null; S.tab = "current"; S.past = null; S.pvView = "list"; renderMain(); return; }
  if (el.dataset.pick === "patient"){ S.patient = el.value; S.ptSel = null; S.ptTab = "current"; S.past = null; S.ptView = "list"; renderMain(); return; }
  if (el.dataset.audit === "who"){ S.auditWho = el.value; const list = $("#audit-list"); if (list) list.innerHTML = auditListHTML(); return; }
  if (el.dataset.file && el.files && el.files[0]){ attachFile(el.dataset.file, el.dataset.role, el.files[0]); el.value = ""; }
});
document.addEventListener("keydown", e => {
  if (e.target.dataset && e.target.dataset.draft && e.key === "Enter" && !e.shiftKey && !e.isComposing){
    e.preventDefault(); e.target.form.requestSubmit();
  }
  if (e.key === "Escape" && S.modal) ACT.closeModal();
  if (S.modal && S.modal.type === "viewer" && (e.ctrlKey || e.metaKey) && /^[psc]$/i.test(e.key)) e.preventDefault();
});
["copy","cut","contextmenu","dragstart"].forEach(type => document.addEventListener(type, e => {
  if (e.target.closest && e.target.closest("[data-protected]")) e.preventDefault();
}));
window.addEventListener("blur", () => document.body.classList.add("away"));
window.addEventListener("focus", () => document.body.classList.remove("away"));
document.addEventListener("visibilitychange", () => document.body.classList.toggle("away", document.hidden));

setInterval(() => {
  document.querySelectorAll(".countdown").forEach(el => {
    const s = P.sessions.find(x => x.id === el.dataset.sid);
    if (s) el.innerHTML = countdownText(s);
  });
}, 30000);

render();
})();
</script>
